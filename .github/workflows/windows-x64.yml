name: Windows x64 CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: x64
      - name: Verify Windows x64
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1); console.log(process.platform, process.arch)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Verify settings and runtime in hidden Electron windows
        run: pnpm exec electron scripts/runtime-ui-smoke.mjs
        env:
          POKE_SETTINGS_SPACING_QA: '1'
      - name: Verify signed GitHub update checks and install IPC
        run: pnpm exec electron scripts/github-update-ipc-smoke.mjs
      - name: Verify launch registration migration
        run: pnpm exec electron scripts/launch-associations-smoke.mjs
      - name: Verify floating pet hover restoration and repaint
        run: pnpm exec electron scripts/pet-ui-smoke.mjs
      - name: Verify floating pet at fractional scales
        run: |
          pnpm exec electron --force-device-scale-factor=1.25 scripts/pet-ui-smoke.mjs
          pnpm exec electron --force-device-scale-factor=1.75 scripts/pet-ui-smoke.mjs
      - name: Verify battle window and original animations
        run: pnpm exec electron scripts/battle-ui-smoke.mjs
        env:
          POKE_BATTLE_EFFECTS: '1'
          POKE_BATTLE_OPENING: '1'
          POKE_BATTLE_SWITCH_QA: '1'
      - name: Verify LAN battle window with two peers
        run: pnpm exec electron scripts/battle-lan-ui-smoke.mjs
      - name: Verify trade renderer with two LAN peers
        run: pnpm exec electron scripts/trade-ui-smoke.mjs
      # Test-only Ed25519 key: QA builds embed the public key and the update smoke signs latest.yml with it.
      - name: Generate QA update signing key
        shell: pwsh
        run: |
          $keyFile = Join-Path $env:RUNNER_TEMP 'update-qa-signing.pem'
          $publicKey = node scripts/windows-update-smoke.mjs generate-key $keyFile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "POKE_UPDATE_QA_PRIVATE_KEY_FILE=$keyFile" >> $env:GITHUB_ENV
          "POKE_UPDATE_QA_PUBLIC_KEY=$publicKey" >> $env:GITHUB_ENV
      - name: Build the Windows x64 installer
        run: pnpm package:win
        env:
          POKE_WINDOWS_QA: '1'
          POKE_WINDOWS_OUTPUT: release/base
      - name: Build higher-version update installer
        run: |
          $updateVersion = node -e "const p=require('./package.json').version.split('.').map(Number);p[2]++;process.stdout.write(p.join('.'))"
          pnpm exec electron-builder --config electron-builder.config.cjs "--config.extraMetadata.version=$updateVersion" --win nsis --x64 --publish never
        env:
          POKE_WINDOWS_QA: '1'
          POKE_WINDOWS_OUTPUT: release/update
      - name: Verify packaged version handoff and save preservation
        run: node scripts/instance-handoff-smoke.mjs release/base/win-unpacked/PokeTokenBar.exe release/update/win-unpacked/PokeTokenBar.exe
      - name: Verify signed in-app update and ZIP folder to Setup.exe handoff
        run: node scripts/windows-update-smoke.mjs release/base release/update
      - name: Upload QA installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-qa
          path: |
            release/*/*-Setup.exe
            release/*/*.blockmap
            release/*/latest.yml
          if-no-files-found: error
