name: Windows x64 CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          architecture: x64
      - name: Verify Windows x64
        run: node -e "if (process.platform !== 'win32' || process.arch !== 'x64') process.exit(1); console.log(process.platform, process.arch)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: node --test tests/usage.test.mjs tests/usage-recap.test.mjs tests/companion.test.mjs tests/save-import.test.mjs tests/trade.test.mjs tests/battle.test.mjs tests/battle-progress.test.mjs tests/battle-presentation.test.mjs tests/held-items.test.mjs tests/battle-lan.test.mjs tests/runtime.test.mjs tests/pokemon-details.test.mjs tests/presentation.test.mjs
      - name: Verify settings and runtime in hidden Electron windows
        run: pnpm exec electron scripts/runtime-ui-smoke.mjs
      - name: Verify battle window and original animations
        run: pnpm exec electron scripts/battle-ui-smoke.mjs
        env:
          POKE_BATTLE_EFFECTS: '1'
          POKE_BATTLE_OPENING: '1'
      - name: Verify LAN battle window with two peers
        run: pnpm exec electron scripts/battle-lan-ui-smoke.mjs
      - name: Verify trade renderer with two LAN peers
        run: pnpm exec electron scripts/trade-ui-smoke.mjs
      - name: Build the Windows x64 installer
        run: pnpm package:win
        env:
          POKE_WINDOWS_QA: '1'
          POKE_WINDOWS_OUTPUT: release/base
      - name: Build the next Windows x64 version
        run: |
          node scripts/windows-next-version.mjs
          pnpm package:win
        env:
          POKE_WINDOWS_QA: '1'
          POKE_WINDOWS_OUTPUT: release/update
      - name: Install and exercise the in-app updater
        run: node scripts/windows-update-smoke.mjs release/base release/update
      - name: Upload QA installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-qa
          path: |
            release/*/*-Setup.exe
            release/*/*.blockmap
            release/*/latest.yml
          if-no-files-found: error
